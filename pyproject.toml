[project]
name = "quant-research-agent-skill"
version = "0.1.0"
description = "Research modules and skill library for quant stat-arb experiments."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=0.20",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

